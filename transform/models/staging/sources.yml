version: 2

sources:
  - name: fdorg
    description: >
      Raw tables loaded by dlt from football-data.org into the `raw` schema of
      the DuckDB warehouse.
    schema: raw
    tables:
      - name: scorers
        description: >
          Current-season La Liga top scorers, flattened by the Python ingestion
          layer from the /v4/competitions/PD/scorers endpoint.
        columns:
          - name: player_id
            description: football-data.org player id.
          - name: player_name
            description: Player's full name.
          - name: date_of_birth
            description: Player's date of birth.
          - name: nationality
            description: Player's nationality.
          - name: team_id
            description: football-data.org team id.
          - name: team_name
            description: Player's club name.
          - name: goals
            description: Goals scored in the current season.
          - name: assists
            description: Assists in the current season.
          - name: penalties
            description: Goals scored from penalties.
      - name: standings
        description: >
          Current-season La Liga table, flattened by the Python ingestion layer
          from the /v4/competitions/PD/standings endpoint.
        columns:
          - name: position
            description: League position (1-20).
          - name: team_id
            description: football-data.org team id.
          - name: team_name
            description: Team name.
          - name: played_games
            description: Matches played.
          - name: won
            description: Matches won.
          - name: draw
            description: Matches drawn.
          - name: lost
            description: Matches lost.
          - name: points
            description: Points.
          - name: goals_for
            description: Goals scored.
          - name: goals_against
            description: Goals conceded.
          - name: goal_difference
            description: Goals scored minus conceded.
      - name: matches
        description: >
          Current-season La Liga fixtures and results, flattened by the Python
          ingestion layer from the /v4/competitions/PD/matches endpoint.
        columns:
          - name: match_id
            description: football-data.org match id.
          - name: season
            description: Season start year (e.g. 2026 for 2026/27).
          - name: matchday
            description: Matchday number (1-38).
          - name: utc_date
            description: Kickoff time in UTC.
          - name: status
            description: Match status (FINISHED, TIMED, SCHEDULED, ...).
          - name: home_team_id
            description: football-data.org home team id.
          - name: home_team_name
            description: Home team name.
          - name: home_team_crest
            description: Home club crest image URL.
          - name: away_team_id
            description: football-data.org away team id.
          - name: away_team_name
            description: Away team name.
          - name: away_team_crest
            description: Away club crest image URL.
          - name: home_goals
            description: Full-time home goals (null until the match is played).
          - name: away_goals
            description: Full-time away goals (null until the match is played).
          - name: winner
            description: Match winner (HOME_TEAM, AWAY_TEAM, or DRAW).
      - name: matches_history
        description: >
          Past La Liga seasons' fixtures and results, flattened by the Python
          ingestion layer from the /v4/competitions/PD/matches endpoint with a
          season filter. Loaded to support head-to-head history.
        columns:
          - name: match_id
            description: football-data.org match id.
          - name: season
            description: Season start year (e.g. 2025 for 2025/26).
          - name: matchday
            description: Matchday number (1-38).
          - name: utc_date
            description: Kickoff time in UTC.
          - name: status
            description: Match status (FINISHED, TIMED, SCHEDULED, ...).
          - name: home_team_id
            description: football-data.org home team id.
          - name: home_team_name
            description: Home team name.
          - name: home_team_crest
            description: Home club crest image URL.
          - name: away_team_id
            description: football-data.org away team id.
          - name: away_team_name
            description: Away team name.
          - name: away_team_crest
            description: Away club crest image URL.
          - name: home_goals
            description: Full-time home goals (null until the match is played).
          - name: away_goals
            description: Full-time away goals (null until the match is played).
          - name: winner
            description: Match winner (HOME_TEAM, AWAY_TEAM, or DRAW).
