version: 2

models:
  - name: stg_fdorg__scorers
    description: >
      Clean, typed scorers rows from the raw dlt table. One row per player in
      the current season's top-scorer list. Types are cast explicitly so
      downstream models never depend on source types.
    columns:
      - name: player_id
        description: football-data.org player id.
        tests:
          - not_null
          - unique
      - name: player_name
        description: Player's full name.
        tests:
          - not_null
      - name: date_of_birth
        description: Player's date of birth.
      - name: nationality
        description: Player's nationality.
      - name: team_id
        description: football-data.org team id.
        tests:
          - not_null
      - name: team_name
        description: Player's club name (denormalized).
        tests:
          - not_null
      - name: goals
        description: Goals scored in the current season.
        tests:
          - not_null
      - name: assists
        description: Assists in the current season.
      - name: penalties
        description: Goals scored from penalties.
  - name: stg_fdorg__standings
    description: >
      Clean, typed standings rows from the raw dlt table. One row per team in
      the current season's full table. Types are cast explicitly so downstream
      models never depend on source types.
    columns:
      - name: position
        description: League position (1-20).
        tests:
          - not_null
          - unique
      - name: team_id
        description: football-data.org team id.
        tests:
          - not_null
          - unique
      - name: team_name
        description: Team name.
        tests:
          - not_null
      - name: team_crest
        description: Club crest image URL.
      - name: played_games
        description: Matches played.
        tests:
          - not_null
      - name: won
        description: Matches won.
      - name: draw
        description: Matches drawn.
      - name: lost
        description: Matches lost.
      - name: points
        description: Points.
        tests:
          - not_null
      - name: goals_for
        description: Goals scored.
      - name: goals_against
        description: Goals conceded.
      - name: goal_difference
        description: Goals scored minus conceded.
  - name: stg_fdorg__matches
    description: >
      Clean, typed match rows from the raw dlt table. One row per match in the
      current season. Types are cast explicitly so downstream models never
      depend on source types.
    columns:
      - name: match_id
        description: football-data.org match id.
        tests:
          - not_null
          - unique
      - name: season
        description: Season start year (e.g. 2026 for 2026/27).
      - name: matchday
        description: Matchday number (1-38).
        tests:
          - not_null
      - name: utc_date
        description: Kickoff time in UTC.
        tests:
          - not_null
      - name: status
        description: Match status (FINISHED, TIMED, SCHEDULED, ...).
        tests:
          - not_null
      - name: home_team_id
        description: football-data.org home team id.
      - name: home_team_name
        description: Home team name.
        tests:
          - not_null
      - name: home_team_crest
        description: Home club crest image URL.
      - name: away_team_id
        description: football-data.org away team id.
      - name: away_team_name
        description: Away team name.
        tests:
          - not_null
      - name: away_team_crest
        description: Away club crest image URL.
      - name: home_goals
        description: Full-time home goals (null until the match is played).
      - name: away_goals
        description: Full-time away goals (null until the match is played).
      - name: winner
        description: Match winner (HOME_TEAM, AWAY_TEAM, or DRAW).
  - name: stg_fdorg__matches_history
    description: >
      Clean, typed match rows from the raw dlt history table. One row per match
      across past seasons (the current season and the three before it), loaded
      to support head-to-head history. Types are cast explicitly so downstream
      models never depend on source types.
    columns:
      - name: match_id
        description: football-data.org match id.
        tests:
          - not_null
          - unique
      - name: season
        description: Season start year (e.g. 2025 for 2025/26).
        tests:
          - not_null
      - name: matchday
        description: Matchday number (1-38).
        tests:
          - not_null
      - name: utc_date
        description: Kickoff time in UTC.
        tests:
          - not_null
      - name: status
        description: Match status (FINISHED, TIMED, SCHEDULED, ...).
        tests:
          - not_null
      - name: home_team_id
        description: football-data.org home team id.
      - name: home_team_name
        description: Home team name.
        tests:
          - not_null
      - name: home_team_crest
        description: Home club crest image URL.
      - name: away_team_id
        description: football-data.org away team id.
      - name: away_team_name
        description: Away team name.
        tests:
          - not_null
      - name: away_team_crest
        description: Away club crest image URL.
      - name: home_goals
        description: Full-time home goals (null until the match is played).
      - name: away_goals
        description: Full-time away goals (null until the match is played).
      - name: winner
        description: Match winner (HOME_TEAM, AWAY_TEAM, or DRAW).
