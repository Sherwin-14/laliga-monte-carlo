version: 2

models:
  - name: fct_top_scorers
    description: >
      Current La Liga top scorers, ranked by goals (then player name). One row
      per player, with the team name denormalized in and age computed from date
      of birth. This is the single table the top-scorers page reads.
    columns:
      - name: scorer_rank
        description: 1-based rank by goals desc, then player name.
        tests:
          - not_null
      - name: player_name
        description: Player's full name.
      - name: team_name
        description: Player's club name (denormalized).
      - name: nationality
        description: Player's nationality.
      - name: age
        description: Player's whole-year age as of the refresh date.
      - name: goals
        description: Goals scored in the current season.
  - name: fct_standings
    description: >
      The current La Liga table, ordered by position, with the team name
      denormalized in. This is the single table the standings section reads.
    columns:
      - name: position
        description: League position (1-20).
        tests:
          - not_null
      - name: team_name
        description: Team name.
        tests:
          - not_null
      - name: played_games
        description: Matches played.
      - name: won
        description: Matches won.
      - name: draw
        description: Matches drawn.
      - name: lost
        description: Matches lost.
      - name: goals_for
        description: Goals scored.
      - name: goals_against
        description: Goals conceded.
      - name: goal_difference
        description: Goals scored minus conceded.
      - name: points
        description: Points.
        tests:
          - not_null
  - name: fct_upcoming_fixtures
    description: >
      The next La Liga matchday's fixtures (non-finished matches in the earliest
      upcoming matchday), ordered by kickoff. This is the single table the
      "next matchday" section reads.
    columns:
      - name: matchday
        description: Matchday number.
      - name: status
        description: Match status (TIMED, SCHEDULED, POSTPONED, ...).
      - name: match_date
        description: Kickoff date in Spain local time.
      - name: kickoff_madrid
        description: Kickoff time in Spain local time (HH:MM).
      - name: kickoff_utc
        description: Kickoff time in UTC (HH:MM).
      - name: home_team_name
        description: Home team name.
        tests:
          - not_null
      - name: away_team_name
        description: Away team name.
        tests:
          - not_null
