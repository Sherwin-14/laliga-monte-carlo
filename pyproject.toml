[project]
name = "laliga-monte-carlo"
version = "0.1.0"
description = "La Liga title and relegation forecast dashboard (dlt + dbt + DuckDB + Evidence)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # dbt: core + adapter must match minor version (dbt-duckdb has no 1.12 yet).
    "dbt-core==1.11.17",
    "dbt-duckdb==1.11.1",
    # duckdb stays on 1.x — dbt-duckdb 1.11 targets DuckDB 1.x (2.0 is a breaking bump).
    "duckdb==1.5.6",
    "dlt[duckdb]==1.32.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
]
